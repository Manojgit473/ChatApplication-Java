# Test Profile Configuration using in-memory H2 database
spring.application.name=connect-chat-test

spring.datasource.url=jdbc:h2:mem:connectchat_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

connectchat.upload.dir=target/test-uploads
