# ========================================================
# Connect Chat - Development / Demo Profile (H2 In-Memory)
# ========================================================
server.port=${SERVER_PORT:8080}

# H2 Database
spring.datasource.url=jdbc:h2:mem:connect_chat_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uploads directory & limits
app.upload.dir=uploads/attachments
app.upload.max-file-size=10MB
app.upload.allowed-extensions=jpg,jpeg,png,gif,webp,pdf,doc,docx,txt,zip

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Session timeout (2 hours)
server.servlet.session.timeout=120m

