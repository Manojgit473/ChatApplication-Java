# ========================================================
# Connect Chat - Spring Boot Application Configuration
# ========================================================

spring.application.name=connect-chat
server.port=${SERVER_PORT:8080}

# --------------------------------------------------------
# MySQL Database & DataSource Configuration
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:connect_chat_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:20keertheswar27}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --------------------------------------------------------
# JPA & Hibernate ORM Configuration
# --------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# --------------------------------------------------------
# Database Migrations (Flyway)
# --------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------------
# Thymeleaf Template Engine Configuration
# --------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# --------------------------------------------------------
# File Upload & Attachment Limits
# --------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:105MB}

# Custom Application Upload Path
connectchat.upload.dir=${UPLOAD_DIR:uploads/attachments}
connectchat.session.timeout-minutes=${SESSION_TIMEOUT_MINUTES:120}

# --------------------------------------------------------
# Jackson JSON Serialization
# --------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --------------------------------------------------------
# AI Smart Chat Summarizer (Google Gemini API)
# --------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# --------------------------------------------------------
# Logging Configuration
# --------------------------------------------------------
logging.level.root=INFO
logging.level.com.connectchat=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO

